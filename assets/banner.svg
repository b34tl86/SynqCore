      <rect x="856" y="168" width="74" height="38" rx="2" fill="#0E2216"/>
      <rect x="856" y="164" width="82" height="2" rx="1" fill="#00D478" opacity="0.55"/>
      <rect x="856" y="198" width="54" height="3" rx="1.5" fill="#00D478" opacity="0.35"/>

