  <!-- ── LEFT TEXT CONTENT ──────────────────────────── -->

  <!-- Vertical green accent bar -->
  <rect x="42" y="64" width="3" height="132" rx="1.5" fill="#00D478"/>

  <!-- Dot at top of bar (live indicator) -->
  <circle cx="43.5" cy="60" r="5.5" fill="#00D478"/>
  <circle cx="43.5" cy="60" r="9" fill="#00D478" opacity="0.18"/>

  <!-- Main headline: SYNQCORE -->
  <text x="66" y="178"
