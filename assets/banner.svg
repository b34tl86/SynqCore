    font-weight="900"
    letter-spacing="4"
    fill="#E4F0F8">SYNQ<tspan fill="#00D478">CORE</tspan></text>

  <!-- Tagline -->
  <text x="70" y="211"
    font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
