<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <!-- Scanline texture -->
    <pattern id="sl" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect y="3" width="1200" height="1" fill="#FFFFFF" opacity="0.016"/>
    </pattern>

    <!-- Monitor grid fade: transparent left → opaque right -->
    <linearGradient id="mf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="44%" stop-color="black"/>
      <stop offset="64%" stop-color="white"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>
    <mask id="gm">
      <rect width="1200" height="260" fill="url(#mf)"/>
    </mask>

    <!-- Subtle right-edge fade-out so monitors blend into bg -->
    <linearGradient id="re" x1="0" y1="0" x2="1" y2="0">
      <stop offset="85%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>
    <mask id="rm">
      <rect width="1200" height="260" fill="url(#re)"/>
    </mask>
  </defs>

  <!-- ── BACKGROUND ─────────────────────────────────── -->
  <rect width="1200" height="260" fill="#07090C"/>

  <!-- Subtle left-to-right gradient warmth -->
  <rect width="1200" height="260" fill="url(#sl)"/>

  <!-- ── MONITOR GRID (right half, double-masked) ──── -->
  <g mask="url(#rm)">
    <g mask="url(#gm)" opacity="0.22">

      <!-- ROW 0  y=28 ─────────────────── -->
      <!-- Col 0 x=668 :: dark/default -->
